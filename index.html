<html lang="hi">
<head>
  <meta charset="UTF-8">

  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { 
      --bg: #030708; 
      --header: rgba(6, 12, 10, 0.95); 
      --card-bg: rgba(10, 20, 16, 0.7);
      --primary: #00ff66; 
      --primary-hover: #00cc52;
      --primary-glow: rgba(0, 255, 102, 0.25);
      --text: #f0f5f2; 
      --text-muted: #94a3b8;
      --border: rgba(0, 255, 102, 0.12); 
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(0, 255, 102, 0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    .header { 
      background: var(--header); 
      padding: 15px 5%; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      position: sticky; 
      top: 0; 
      z-index: 100; 
      border-bottom: 1px solid var(--border); 
      backdrop-filter: blur(15px); 
    }
    .header .logo { 
      font-size: 26px; 
      font-weight: 900; 
      color: var(--primary); 
      cursor: pointer; 
      letter-spacing: 2px; 
      text-shadow: 0 0 10px var(--primary-glow);
    }
    .search-bar { flex: 1; margin: 0 30px; max-width: 450px; position: relative; }
    .search-bar input { 
      width: 100%; 
      padding: 10px 20px 10px 45px; 
      border: 1px solid var(--border); 
      border-radius: 30px; 
      background: rgba(10, 20, 16, 0.5); 
      color: white; 
      font-size: 14px; 
      outline: none;
      transition: 0.3s;
    }
    .search-bar input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }
    .search-bar i { position: absolute; left: 18px; top: 13px; color: var(--text-muted); }
    
    .header-right { display: flex; align-items: center; gap: 15px; }
    .btn-action {
      cursor: pointer; 
      font-size: 13px; 
      font-weight: 700; 
      color: var(--primary); 
      border: 1px solid var(--border); 
      padding: 7px 16px; 
      border-radius: 20px;
      background: rgba(0, 255, 102, 0.05);
      transition: 0.2s;
    }
    .btn-action:hover {
      background: var(--primary);
      color: #000;
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .menu-btn { font-size: 22px; cursor: pointer; color: var(--primary); }

    /* Sidebar */
    .sidebar { position: fixed; right: -280px; top: 0; width: 280px; height: 100%; background: #050a07; padding: 30px 20px; transition: 0.3s; z-index: 1000; border-left: 1px solid var(--border); }
    .sidebar.open { right: 0; }
    .sidebar h3 { font-size: 18px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; }
    .sidebar a { display: flex; align-items: center; gap: 12px; color: white; padding: 12px; text-decoration: none; margin: 5px 0; border-radius: 8px; font-weight: bold; font-size: 14px; }
    .sidebar a:hover { background: rgba(0, 255, 102, 0.08); color: var(--primary); }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; display: none; }
    .overlay.show { display: block; }

    /* Slider */
    .slider-wrapper { padding: 0 5%; margin-top: 20px; margin-bottom: 30px; }
    .slider-container { display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 10px 0; }
    .slider-container::-webkit-scrollbar { display: none; }
    .slide-card { flex: 0 0 320px; height: 180px; border-radius: 12px; position: relative; overflow: hidden; cursor: pointer; border: 1px solid var(--border); scroll-snap-align: start; transition: 0.3s; }
    .slide-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 5px 15px var(--primary-glow); }
    .slide-card img { width: 100%; height: 100%; object-fit: cover; }
    .slide-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(3,7,8,1), transparent); padding: 15px; }
    .slide-title { font-weight: bold; font-size: 14px; color: white; margin-top: 4px; }
    .slide-tag { font-size: 10px; color: var(--primary); font-weight: 800; text-transform: uppercase; }

    /* Grid Layout - Updated based on requirements */
    .section-title { padding: 10px 5%; font-size: 22px; text-transform: uppercase; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
    .section-title span { color: var(--primary); }
    
    .posts-grid { 
      display: grid; 
      /* Larger cards to match screenshot */
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
      gap: 35px 25px; 
      padding: 20px 5%; 
    }
    
    .post-card { 
      background: transparent; 
      position: relative; 
      cursor: pointer; 
      transition: 0.3s;
      display: flex;
      flex-direction: column;
    }
    .post-card:hover { transform: translateY(-5px); }
    
    /* Cover Image Wrapper */
    .post-image-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9; /* Widescreen aspect ratio like screenshot */
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--card-bg);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .post-card:hover .post-image-wrapper {
      border-color: var(--primary); 
      box-shadow: 0 8px 25px var(--primary-glow); 
    }
    
    .post-image-wrapper img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }
    
    /* Unique Black Box (No Image Fallback) */
    .black-box-placeholder {
      width: 100%; 
      height: 100%; 
      background: linear-gradient(135deg, #050a07 0%, #0d1a14 100%); 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      text-align: center; 
      padding: 20px; 
      box-sizing: border-box;
    }
    .black-box-placeholder i {
      font-size: 45px;
      color: rgba(0, 255, 102, 0.2);
      margin-bottom: 15px;
    }
    .black-box-placeholder span {
      color: var(--primary); 
      font-weight: 800; 
      font-size: 18px; 
      word-break: break-word;
      text-shadow: 0px 3px 5px rgba(0,0,0,0.6);
    }

    .new-badge { position: absolute; top: 10px; left: 10px; background: var(--primary); color: #000; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 900; z-index: 10; text-transform: uppercase; }
    .post-image-wrapper .category-tag { position: absolute; bottom: 10px; right: 10px; background: #e67e22; color: #fff; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    
    /* Text Below Image */
    .post-card .title-text { 
      padding: 15px 5px 10px 5px; 
      font-size: 17px; 
      text-align: left; 
      font-weight: 700; 
      color: white;
      line-height: 1.4;
      width: 100%;
    }
    
    /* Line under Title */
    .post-card .title-divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin-top: 5px;
      transition: 0.3s;
    }
    .post-card:hover .title-divider {
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    /* Detail Page */
    .detail-page { display: none; padding: 40px 5%; max-width: 1200px; margin: 20px auto; background: rgba(10, 20, 16, 0.6); border-radius: 16px; border: 1px solid var(--border); }
    .detail-page.active { display: block; }
    .back-btn { background: none; color: var(--primary); border: 1px solid var(--border); padding: 8px 20px; border-radius: 20px; font-size: 13px; cursor: pointer; margin-bottom: 25px; font-weight: bold; }
    .back-btn:hover { background: rgba(0, 255, 102, 0.1); }
    
    .detail-header { display: flex; gap: 40px; flex-wrap: wrap; margin-bottom: 40px; }
    .detail-header img { width: 250px; border-radius: 12px; border: 1px solid var(--border); }
    .detail-info { flex: 1; min-width: 300px; }
    .detail-info h2 { font-size: 30px; margin-bottom: 15px; color: var(--primary); font-weight: 900; }
    .detail-info p { margin-bottom: 12px; font-size: 14px; line-height: 1.6; color: var(--text-muted); }
    .detail-info p strong { color: white; }

    .action-row { display: flex; gap: 10px; margin-top: 20px; }
    .btn-fav { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
    .btn-fav.active { background: var(--primary); color: #000; }

    /* Player */
    .player-section { display: none; margin-top: 30px; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); position: relative; padding-top: 56.25%; }
    .player-section iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    /* Episodes list */
    .episodes { margin-top: 30px; background: rgba(5, 10, 7, 0.8); padding: 25px; border-radius: 12px; border: 1px solid var(--border); }
    .episodes h3 { border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; }
    .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .episodes button { background: #0b110e; color: white; border: 1px solid var(--border); padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 12px; }
    .episodes button:hover { background: var(--primary); color: #000; transform: translateY(-2px); }

    /* Modals */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
    .modal.active { display: flex; }
    .modal-box { background: #070d0a; border: 1px solid var(--border); padding: 35px; border-radius: 16px; text-align: center; width: 100%; max-width: 420px; position: relative; }
    .modal-box h3 { margin-bottom: 10px; color: var(--primary); font-size: 22px; }
    .modal-box p { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
    .modal-box input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0d1410; border: 1px solid var(--border); color: white; border-radius: 8px; text-align: center; outline: none; }
    .modal-box input:focus { border-color: var(--primary); }
    .modal-box button { background: var(--primary); color: #000; padding: 12px; border: none; border-radius: 8px; margin: 5px 0; cursor: pointer; font-weight: bold; width: 100%; }
    .close-modal { position: absolute; top: 15px; right: 15px; font-size: 22px; cursor: pointer; color: #777; }

    .pagination-controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 40px auto; }
    .pagination-btn { background: rgba(10, 20, 16, 0.8); border: 1px solid var(--border); color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .pagination-btn:hover:not(:disabled) { background: var(--primary); color: #000; }
    .pagination-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    @media (max-width: 768px) {
      .header { padding: 12px 15px; flex-wrap: wrap; gap: 10px; }
      .search-bar { order: 3; margin: 0; width: 100%; flex: 1 1 100%; }
      .posts-grid { grid-template-columns: 1fr; gap: 30px; padding: 15px; } /* Single column view on mobile */
      .detail-header { justify-content: center; text-align: center; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div style="display: flex; align-items: center; gap: 15px;">
      <span class="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></span>
      <span class="logo" onclick="navigateToHome()">𝙰𝚂𝙸☠</span>
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search anime, dramas, or movies..." oninput="searchPosts()">
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>
    <div class="header-right">
      <span id="premiumUserStatus" style="font-size: 11px; color: var(--primary); display: none;"></span>
      <span id="authBtn" class="btn-action" onclick="handleAuthAction()">Premium Login</span>
    </div>
  </div>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <h3>Navigations</h3>
    <a href="#home"><i class="fa-solid fa-house"></i> Home</a>
    <a href="#watchlist" onclick="showWatchlist()"><i class="fa-solid fa-bookmark"></i> My Watchlist</a>
    <a href="#" onclick="showSidebarSection('category')"><i class="fa-solid fa-layer-group"></i> Categories</a>
    <a href="#" onclick="showSidebarSection('genre')"><i class="fa-solid fa-masks-theater"></i> Genres</a>
    <a href="#" onclick="showSidebarSection('az')"><i class="fa-solid fa-arrow-down-a-z"></i> A-Z List</a>
    <a href="#" onclick="openPaidRequestPrompt()"><i class="fa-solid fa-lock"></i> Locked Link</a>
    <a href="#" id="tgChannel" target="_blank"><i class="fa-brands fa-telegram"></i> Telegram Channel</a>
  </div>

  <div id="mainContent">

    <div id="featuredSection" class="slider-wrapper" style="display:none;">
      <h3 class="section-title" style="font-size:16px; margin-bottom:10px; padding: 0;">🌟 Hot Featured</h3>
      <div id="featuredSlider" class="slider-container"></div>
    </div>

    <h2 class="section-title" id="gridTitle">Latest Updates</h2>
    <div id="postsGrid" class="posts-grid"></div>
    
    <div id="paginationControls" class="pagination-controls"></div>
    
    <!-- Detail Page -->
    <div id="detailPage" class="detail-page">
      <button class="back-btn" onclick="window.history.back()"><i class="fa-solid fa-arrow-left"></i> Back to Catalog</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box" id="modalContent"></div>
  </div>

  <script>
    const SANITY_PROJECT_ID = 'vb4q5oda'; 
    const SANITY_DATASET = 'production';

    let activeDatabases = [{ projectId: SANITY_PROJECT_ID, dataset: SANITY_DATASET }];
    let allPosts = [];
    let settings = {};
    let watchlist = JSON.parse(localStorage.getItem('watchlist')) || [];

    let currentPage = 1;
    const postsPerPage = 12;
    let currentFilteredPosts = [];

    document.addEventListener("DOMContentLoaded", () => {
      loadApp();
      updateAuthUI();
      window.addEventListener("hashchange", handleRouting);
    });

    async function fetchFromNode(node, queryStr) {
      try {
        const url = `https://${node.projectId}.api.sanity.io/v2021-06-07/data/query/${node.dataset}?query=${encodeURIComponent(queryStr)}`;
        const res = await fetch(url);
        if(!res.ok) return null;
        const json = await res.json();
        return json.result;
      } catch(e) {
        return null;
      }
    }

    async function loadApp() {
      try {
        const initQuery = `{
          "posts": *[_type == "post"],
          "settings": *[_type == "setting"],
          "db_nodes": *[_type == "db_config"]
        }`;

        const primaryData = await fetchFromNode({ projectId: SANITY_PROJECT_ID, dataset: SANITY_DATASET }, initQuery);
        activeDatabases = [{ projectId: SANITY_PROJECT_ID, dataset: SANITY_DATASET }];

        if (primaryData?.db_nodes) {
          primaryData.db_nodes.forEach(node => {
            if (node.project_id && node.dataset) {
              activeDatabases.push({ projectId: node.project_id, dataset: node.dataset });
            }
          });
        }

        settings = {};
        if (primaryData?.settings) {
          primaryData.settings.forEach(doc => {
            if (doc.key) settings[doc.key] = doc.value;
          });
        }

        document.getElementById("tgChannel").href = settings.channel_link || "#";

        const postPromises = activeDatabases.map(node => fetchFromNode(node, `*[_type == "post"]`));
        const multiResults = await Promise.all(postPromises);

        let combinedPosts = [];
        multiResults.forEach((postList) => {
          if (Array.isArray(postList)) {
            postList.forEach(doc => {
              combinedPosts.push({
                id: doc._id,
                name: doc.name || "Untitled",
                image_url: doc.image_url || "",
                release_date: doc.release_date || "",
                genres: doc.genres || "",
                season: doc.season || "",
                short_story: doc.short_story || "",
                category: doc.category || "Uncategorized",
                updatedAt: doc._updatedAt || new Date().toISOString()
              });
            });
          }
        });

        const postMap = new Map();
        combinedPosts.forEach(p => postMap.set(p.id, p));
        allPosts = Array.from(postMap.values());

        handleRouting();
      } catch(e) {
        console.error("Initialization failed", e);
        renderPosts([]);
      }
    }

    function handleRouting() {
      const hash = window.location.hash || "#home";
      closeModal();
      currentPage = 1;

      // Clear search input if not in search view
      if (!hash.startsWith("#search?q=")) {
        document.getElementById("searchInput").value = "";
      }
      
      if (hash.startsWith("#detail?id=")) {
        const postId = hash.split("?id=")[1];
        renderDetailView(postId);
      } else if (hash.startsWith("#category?name=")) {
        const cat = decodeURIComponent(hash.split("?name=")[1]);
        renderCategoryPage(cat);
      } else if (hash.startsWith("#genre?name=")) {
        const gen = decodeURIComponent(hash.split("?name=")[1]);
        renderGenrePage(gen);
      } else if (hash.startsWith("#az?letter=")) {
        const letter = decodeURIComponent(hash.split("?letter=")[1]);
        renderLetterPage(letter);
      } else if (hash.startsWith("#search?q=")) {
        const queryVal = decodeURIComponent(hash.split("?q=")[1]);
        document.getElementById("searchInput").value = queryVal;
        searchPosts();
      } else if (hash === "#watchlist") {
        renderWatchlistPage();
      } else {
        renderHomeView();
      }
    }

    function navigateToHome() { window.location.hash = "#home"; }

    function renderHomeView() {
      document.getElementById("postsGrid").style.display = "grid";
      document.getElementById("paginationControls").style.display = "flex";
      document.getElementById("gridTitle").style.display = "block";
      document.getElementById("gridTitle").innerHTML = `Latest Updates`;
      document.getElementById("detailPage").classList.remove("active");
      
      updateDynamicSEO(null);

      renderFeaturedSlider();
      allPosts.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
      renderPosts(allPosts);
    }

    function renderFeaturedSlider() {
      const featuredSec = document.getElementById("featuredSection");
      const slider = document.getElementById("featuredSlider");
      if (allPosts.length === 0) { featuredSec.style.display = "none"; return; }

      featuredSec.style.display = "block";
      const selected = allPosts.slice(0, 6);

      slider.innerHTML = selected.map(p => `
        <div class="slide-card" onclick="window.location.hash = '#detail?id=${p.id}'">
          ${p.image_url ? `<img src="${p.image_url}" alt="${p.name}">` : `
            <div class="black-box-placeholder">
              <i class="fa-solid fa-image"></i>
              <span>${p.name}</span>
            </div>
          `}
          <div class="slide-info">
            <div class="slide-tag">${p.category}</div>
            <div class="slide-title">${p.name}</div>
          </div>
        </div>
      `).join("");
    }

    // UPDATED RENDER POSTS FUNCTION (Image Wrapper + Text below + Line)
    function renderPosts(posts) {
      currentFilteredPosts = posts;
      const grid = document.getElementById("postsGrid");
      const paginationControls = document.getElementById("paginationControls");
      
      if (posts.length === 0) {
        grid.innerHTML = "<div style='grid-column:1/-1; text-align:center; padding:50px; color:var(--text-muted);'>Nothing found in this selection.</div>";
        paginationControls.innerHTML = "";
        return;
      }

      const totalPages = Math.ceil(posts.length / postsPerPage);
      const startIndex = (currentPage - 1) * postsPerPage;
      const paginatedSlice = posts.slice(startIndex, startIndex + postsPerPage);
      
      grid.innerHTML = paginatedSlice.map(p => {
        const isNew = (new Date() - new Date(p.updatedAt)) < (72 * 60 * 60 * 1000);
        return `
          <div class="post-card" onclick="window.location.hash = '#detail?id=${p.id}'">
            <div class="post-image-wrapper">
              ${isNew ? '<span class="new-badge">NEW</span>' : ''}
              <span class="category-tag">${p.category}</span>
              ${p.image_url ? `<img src="${p.image_url}" alt="${p.name}">` : `
                <div class="black-box-placeholder">
                  <i class="fa-solid fa-image"></i>
                  <span>${p.name}</span>
                </div>
              `}
            </div>
            <div class="title-text">${p.name}</div>
            <div class="title-divider"></div>
          </div>
        `;
      }).join("");

      if (totalPages > 1) {
        paginationControls.innerHTML = `
          <button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(-1)">Prev</button>
          <span style="font-weight:bold; font-size:13px;">Page ${currentPage} of ${totalPages}</span>
          <button class="pagination-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(1)">Next</button>
        `;
      } else {
        paginationControls.innerHTML = "";
      }
    }

    async function solveShortener(epId) {
      showModal(`<h3>Decrypting Route</h3><p>Setting up your secure server connection...</p>`);
      let originalLink = null;
      try {
        let ep = null;
        for (let node of activeDatabases) {
          const res = await fetchFromNode(node, `*[_type == "episode" && _id == "${epId}"][0]`);
          if (res) { ep = res; break; }
        }

        if (!ep || !ep.original_link) return alert("Link Error");
        originalLink = ep.original_link;

        const premiumValid = await validatePremiumSession();
        if (premiumValid) {
          referrersFormSubmit(originalLink);
          closeModal();
          return;
        }

        const shResponse = await fetch(`https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${encodeURIComponent('*[_type == "shortener"]')}`);
        const shData = await shResponse.json();
        const shorteners = shData.result || [];

        if (shorteners.length === 0) {
          referrersFormSubmit(originalLink);
          closeModal();
          return;
        }

        const sh = shorteners[Math.floor(Math.random() * shorteners.length)];
        const domainClean = sh.dashboard_url.replace(/^(https?:\/\/)?(www\.)?/, "").split('/')[0];
        const targetApi = `https://${domainClean}/api?api=${sh.api_key}&url=${encodeURIComponent(originalLink)}&format=text`;

        let shortLink = null;
        try {
          const res = await fetch(targetApi);
          const txt = await res.text();
          if (txt.trim().startsWith("http")) shortLink = txt.trim();
        } catch(e) {
          const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetApi)}`;
          const proxyRes = await fetch(proxyUrl);
          const proxyData = await proxyRes.json();
          if (proxyData.contents?.trim().startsWith("http")) shortLink = proxyData.contents.trim();
        }

        referrersFormSubmit(shortLink || originalLink);
        closeModal();
      } catch(e) {
        if(originalLink) referrersFormSubmit(originalLink);
        closeModal();
      }
    }

    async function validatePremiumSession() {
      const savedGmail = localStorage.getItem("premium_gmail");
      const savedToken = localStorage.getItem("premium_session_token");
      if (!savedGmail || !savedToken) return false;

      try {
        const query = encodeURIComponent(`*[_type == "premiumuser" && gmail == "${savedGmail}"]`);
        const url = `https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-06-07/data/query/${SANITY_DATASET}?query=${query}`;
        const response = await fetch(url);
        const resData = await response.json();
        const docs = resData.result;

        if (!docs || docs.length === 0) { logoutPremium(); return false; }
        const user = docs[0];

        if (new Date() > new Date(user.expires_at)) { logoutPremium(); return false; }
        if (user.active_session !== savedToken) { logoutPremium(); return false; }

        return true;
      } catch (err) {
        return false;
      }
    }

        window.location.hash = `#az?letter=${encodeURIComponent(val)}`;
      } else {
        window.location.hash = `#${type}?name=${encodeURIComponent(val)}`;
      }
    }

    function showModal(html) {
      const m = document.getElementById("modal");
      document.getElementById("modalContent").innerHTML = html;
      m.classList.add("active");
    }

    function closeModal() { document.getElementById("modal").classList.remove("active"); }
  </script>
</body>
</html>
